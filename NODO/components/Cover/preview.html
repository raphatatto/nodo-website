<!-- @dsCard height=288 -->
<!doctype html>
<html><head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Geist:wght@400;500;600&display=swap">
<style>
  html,body{margin:0}
  .cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--color-bg)}
  svg{position:absolute;inset:0}
  .accent{fill:var(--color-accent)}
  .ink{fill:var(--color-text)}
  .deep{fill:var(--nodo-blue-deep)}
  .silver{fill:var(--nodo-silver)}
  .light{fill:var(--nodo-blue-light)}
  .node{fill:var(--nodo-paper)}
  .rule{stroke:var(--color-border);stroke-width:var(--line-width);fill:none}
  .tile{rx:var(--radius-none)}
  .text{position:absolute;left:48px;bottom:40px;max-width:440px}
  .name{margin:0;font-family:var(--font-display);font-weight:700;font-size:120px;line-height:.95;letter-spacing:var(--tracking-display);color:var(--color-text)}
  .tag{margin:16px 0 0;font-family:var(--font-body);font-size:14px;color:var(--color-muted)}
</style></head>
<body>
<div class="cover">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!-- blocks: color-accent (Navy) 224×224, color-text (Carbon/Paper) 128×160, nodo-blue-deep 128×128, nodo-silver 96×128, nodo-blue-light 64×64 — sides from space-7/8/9/10 -->
    <!-- arrangement: one Navy slab with satellites, flush modular grid bleeding off top and right edges, square (radius-none) -->
    <!-- pattern: editorial hairlines + one node dot — "linhas finas, grids… Ponto de conexão: pequeno círculo sólido, usado com moderação" -->
    <!-- scales: pitch space-9 (96) / space-8 (64), line-width 1px, radius-none -->
    <rect class="tile accent" x="608" y="0" width="224" height="224"/>
    <rect class="tile ink" x="832" y="0" width="128" height="160"/>
    <rect class="tile deep" x="832" y="160" width="128" height="128"/>
    <rect class="tile silver" x="512" y="160" width="96" height="128"/>
    <rect class="tile light" x="608" y="224" width="64" height="64"/>
    <line class="rule" x1="480" y1="64" x2="960" y2="64"/>
    <line class="rule" x1="480" y1="160" x2="960" y2="160"/>
    <line class="rule" x1="736" y1="0" x2="736" y2="288"/>
    <circle class="node" cx="736" cy="64" r="8"/>
  </svg>
  <div class="text">
    <h1 class="name">NODO</h1>
    <p class="tag">Creativity meets engineering.</p>
  </div>
</div>
<script></script>
</body></html>
